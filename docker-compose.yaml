services:

  # PostgreSQL (auth, user, inventory, order) микросервисы
  postgres:
    image: postgres:15-alpine
    container_name: ecommerce-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MongoDB (каталог товаров и шаблоны уведомлений)
  mongo:
    image: mongo:7.0
    container_name: ecommerce-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo
      MONGO_INITDB_ROOT_PASSWORD: mongo_password
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis (кэширование и распределенные блокировки)
  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redpanda-kafka:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.8
    container_name: ecommerce-redpanda-kafka
    command: >
      redpanda start
      --smp 1
      --memory 512M
      --overprovisioned
      --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      --advertise-kafka-addr internal://redpanda-kafka:9092,external://127.0.0.1:19092
      --schema-registry-addr 0.0.0.0:8081
    ports:
      - "19092:19092" # для Spring Boot приложений
      - "18081:8081" # для генерации Avro-схем
      - "9644:9644" # Admin API
    volumes:
      - redpanda_data:/var/lib/redpanda/data

  redpanda-kafka-console:
    image: docker.redpanda.com/redpandadata/console:v2.6.0
    container_name: ecommerce-redpanda-kafka-console
    depends_on:
      - redpanda-kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: redpanda-kafka:9092
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: http://redpanda-kafka:8081

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  redpanda_data: