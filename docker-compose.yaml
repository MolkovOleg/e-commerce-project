services:
  # ------------------------------------------------------------------------
  # Инфраструктура платформы
  # ------------------------------------------------------------------------

  # PostgreSQL (auth, user, inventory, order) микросервисы
  postgres:
    image: postgres:15-alpine
    container_name: ecommerce-postgres
    env_file:
      - .secrets/dev/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - e-commerce-project

  # MongoDB (каталог товаров и шаблоны уведомлений)
  mongo:
    image: mongo:7.0
    container_name: ecommerce-mongo
    env_file:
      - .secrets/dev/.env
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - e-commerce-project

  # Redis (кэширование и распределенные блокировки)
  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - e-commerce-project

  redpanda-kafka:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.8
    container_name: ecommerce-redpanda-kafka
    command: >
      redpanda start
      --smp 1
      --memory 512M
      --overprovisioned
      --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      --advertise-kafka-addr internal://redpanda-kafka:9092,external://127.0.0.1:19092
      --schema-registry-addr 0.0.0.0:8081
    ports:
      - "19092:19092" # для Spring Boot приложений
      - "18081:8081" # для генерации Avro-схем
      - "9644:9644" # Admin API
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - e-commerce-project

  redpanda-kafka-console:
    image: docker.redpanda.com/redpandadata/console:v2.6.0
    container_name: ecommerce-redpanda-kafka-console
    depends_on:
      redpanda-kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: redpanda-kafka:9092
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: http://redpanda-kafka:8081
    networks:
      - e-commerce-project

  # ------------------------------------------------------------------------
  # Микросервисы платформы
  # ------------------------------------------------------------------------

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: ecommerce-api-gateway
    ports:
      - "8082:8082"
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
      user-service:
        condition: service_started
      product-service:
        condition: service_started
      inventory-service:
        condition: service_started
      order-service:
        condition: service_started
    env_file:
      - .secrets/dev/.env
    environment:
      SPRING_DATA_REDIS_HOST: redis
      AUTH_SERVICE_URL: http://auth-service:8081
      USER_SERVICE_URL: http://user-service:8083
      PRODUCT_SERVICE_URL: http://product-service:8084
      INVENTORY_SERVICE_URL: http://inventory-service:8085
      ORDER_SERVICE_URL: http://order-service:8086
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    networks:
      - e-commerce-project

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: ecommerce-auth-service
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda-kafka:
        condition: service_healthy
    env_file:
      - .secrets/dev/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda-kafka:9092
      SCHEMA_REGISTRY_URL: http://redpanda-kafka:8081
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    networks:
      - e-commerce-project

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: ecommerce-user-service
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda-kafka:
        condition: service_healthy
    env_file:
      - .secrets/dev/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/user_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda-kafka:9092
      SCHEMA_REGISTRY_URL: http://redpanda-kafka:8081
    networks:
      - e-commerce-project

  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: ecommerce-product-service
    ports:
      - "8084:8084"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .secrets/dev/.env
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/product_db?authSource=admin
      SPRING_DATA_REDIS_HOST: redis
    networks:
      - e-commerce-project

  inventory-service:
    build:
      context: ./inventory-service
      dockerfile: Dockerfile
    container_name: ecommerce-inventory-service
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .secrets/dev/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inventory_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
    networks:
      - e-commerce-project

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: ecommerce-order-service
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda-kafka:
        condition: service_healthy
      inventory-service:
        condition: service_started
    env_file:
      - .secrets/dev/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/order_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda-kafka:9092
      SCHEMA_REGISTRY_URL: http://redpanda-kafka:8081
      INVENTORY_SERVICE_GRPC_HOST: inventory-service
      INVENTORY_SERVICE_GRPC_PORT: 9090

    networks:
      - e-commerce-project

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: ecommerce-notification-service
    ports:
      - "8087:8087"
    depends_on:
      mongo:
        condition: service_healthy
      redpanda-kafka:
        condition: service_healthy
    networks:
      - e-commerce-project

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  redpanda_data:

networks:
  e-commerce-project:
    driver: "bridge"