server:
  port: 8082

spring:
  application:
    name: api-gateway

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: 6379

  cloud:
    gateway:
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 10
            redis-rate-limiter.burstCapacity: 20
            key-resolver: "#{@userKeyResolver}"
      routes:
        # auth-service роутинг
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://127.0.0.1:8081}
          predicates:
            - Path=/api/v1/auth/**

        # user-service роутинг
        - id: user-service
          uri: ${USER_SERVICE_URL:http://127.0.0.1:8083}
          predicates:
            - Path=/api/v1/users/**

        # product-service роутинг
        - id: product-service
          uri: ${PRODUCT_SERVICE_URL:http://127.0.0.1:8084}
          predicates:
            - Path=/api/v1/products/**

        # inventory-service роутинг
        - id: inventory-service
          uri: ${INVENTORY_SERVICE_URL:http://127.0.0.1:8085}
          predicates:
            - Path=/api/v1/inventory/**


jwt:
  secret-key: ${JWT_SECRET_KEY:kgy0iUhUm9BkRXwFrw8ksMpP5TmT3tE/o92K2Kjj6ys=}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
