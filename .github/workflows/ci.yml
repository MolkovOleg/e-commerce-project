name: CI Pipeline

on:
  push:
    branches: [ main, "fix/**", "feature/**"]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Checkstyle, Tests & Image Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Verify Code Style (Checkstyle)
        run: ./gradlew checkstyleMain

      - name: Run Unit Tests & JaCoCo Coverage
        run: ./gradlew jacocoTestReport

      - name: Build Application JARs
        run: ./gradlew bootJar -x test

      - name: Verify Docker Images Build
        run: docker compose --env-file .secrets/dev/.env.example build
